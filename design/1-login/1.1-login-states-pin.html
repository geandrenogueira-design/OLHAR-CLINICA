<div class="sheet">
<h1>1.1 · Login · estados do PIN</h1>
<p>Só a parte que muda: campo, mensagem, botão e link. O botão “Entrar” mantém a largura em todos os estados; a linha de mensagem tem altura reservada, então nada pula.</p>
<div class="cells">
<figure class="cell"><figcaption>Verificando</figcaption><label class="fl" for="pin">PIN de acesso</label>
<input class="pin" id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="••••••" value="482916">
<div class="msg " role="alert"><span></span></div>
<div class="acts"><button class="btn pri loading" type="button"><span class="lbl">Entrar</span><span class=spin></span></button></div>
</figure>
<figure class="cell"><figcaption>PIN errado</figcaption><label class="fl" for="pin">PIN de acesso</label>

<figure class="cell"><figcaption>Bloqueado após 5 erros</figcaption><label class="fl" for="pin">PIN de acesso</label>
