<div class="msg " role="alert"><span></span></div>
<div class="acts"><button class="btn pri" type="button"><span class="lbl">Entrar</span></button></div>

<figure class="quote-m"><p>“O importante não é ver o que ninguém nunca viu, mas pensar o que ninguém nunca pensou sobre algo que todo mundo vê.”</p><cite>— Arthur Schopenhauer</cite></figure>

</div>
